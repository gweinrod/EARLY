<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EARLY" />
  <meta name="theme-color" content="#3b82f6" />
  <title>EARLY — Phoneme Practice</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body class="portrait-app">
<div class="container">

  <header class="app-header">
    <h1 class="app-title">EARLY</h1>
    <p class="app-sub">say the word out loud</p>
  </header>

  <div id="errBox"></div>

  <div id="collectorPanel" class="collector-panel">
    <p class="sec-label">teacher session</p>
    <label class="field-label">
      student ID (anonymous)
      <input type="text" id="studentId" class="text-input" placeholder="e.g. S12" autocomplete="off" />
    </label>
    <div class="collector-actions">
      <button type="button" class="btn-secondary" id="btnExportLog">export session log</button>
    </div>
    <div id="judgmentBlock" class="judgment-block">
      <p class="sec-label">your judgment</p>
      <p id="judgmentSummary" class="judgment-summary"></p>
      <div class="judgment-btns">
        <button type="button" class="btn-agree" id="btnAgree">agree with app</button>
        <button type="button" class="btn-disagree" id="btnDisagree">disagree</button>
      </div>
      <p id="judgmentStatus" class="judgment-status"></p>
    </div>
    <div class="teacher-toggles">
      <label class="mode-toggle"><input type="checkbox" id="debugMode" /> show ML debug</label>
      <label class="mode-toggle"><input type="checkbox" id="nonsenseMode" /> nonsense words</label>
    </div>
  </div>

  <div id="netBadge" class="tech-only">
    &#x25CF;&nbsp;
    <span id="netTxt">collecting training data silently</span>
  </div>

  <p class="sec-label">phoneme group</p>
  <div class="pills" id="pillGroup"></div>

  <div class="scores student-hide">
    <div class="sbox"><div class="snum" id="sC">0</div><div class="slbl">correct</div></div>
    <div class="sbox"><div class="snum" id="sT">0</div><div class="slbl">attempts</div></div>
    <div class="sbox"><div class="snum" id="sP">—</div><div class="slbl">accuracy</div></div>
  </div>

  <section class="word-stage">
    <p class="word-label">say this word</p>
    <div id="tWord">—</div>
    <div id="tPhon"></div>
    <div id="resultBanner" class="result-banner" style="display:none" aria-hidden="true"></div>
  </section>

  <div id="fbList"></div>

  <div class="wave-wrap student-hide"><canvas id="waveCanvas" height="72"></canvas></div>

  <div class="btns-bottom">
    <button type="button" class="btn-rec" id="btnRec">
      <span class="dot"></span>
      <span id="btnLbl">tap to speak</span>
    </button>
    <button type="button" class="btn-next" id="btnNext">next word</button>
  </div>

  <div id="hmWrap" class="tech-only">
    <p class="sec-label">mfcc heatmap</p>
    <canvas id="hmCanvas" height="104"></canvas>
  </div>

  <div id="pbWrap" class="tech-only">
    <p class="sec-label">neural network</p>
    <div id="pbBars"></div>
    <p id="pbMeta"></p>
  </div>

  <div id="histBlock" class="student-hide">
    <p class="sec-label">recent attempts</p>
    <div id="histRows"></div>
  </div>

</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
